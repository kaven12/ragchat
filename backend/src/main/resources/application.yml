server:
  port: 8080

spring:
  application:
    name: ragchat
  
  datasource:
    url: jdbc:postgresql://localhost:5432/ragchat
    username: admin
    password: password
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 6000ms
  
  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB
      max-request-size: 100MB

# JWT配置
jwt:
  secret: ragchat-jwt-secret-key-must-be-at-least-32-characters-long-for-hs512
  expiration: 7200000  # 2小时
  refresh-expiration: 86400000  # 24小时

# 限流配置
rate-limit:
  requests-per-minute: 60
  block-duration-minutes: 15

# Milvus配置
milvus:
  host: localhost
  port: 19530
  search:
    nprobe: 10

# MinIO配置
minio:
  host: localhost
  port: 9000
  access-key: minioadmin
  secret-key: minioadmin
  bucket: files
  part-size: 52428800  # 50MB

# DeepSeek配置
deepseek:
  api-key: your-deepseek-api-key
  base-url: https://api.deepseek.com
  model: deepseek-chat

# 日志配置
logging:
  level:
    com.example.ragchat: DEBUG
    org.springframework.security: INFO

# Resilience4j配置
resilience4j:
  circuitbreaker:
    instances:
      llm-api:
        failure-rate-threshold: 50
        wait-duration-in-open-state: 60000
        sliding-window-type: TIME_BASED
        sliding-window-size: 100
        minimum-number-of-calls: 10
  retry:
    instances:
      llm-api:
        max-attempts: 3
        wait-duration: 1000
  ratelimiter:
    instances:
      llm-api:
        limit-for-period: 10
        limit-refresh-period: 1000
  bulkhead:
    instances:
      llm-api:
        max-concurrent-calls: 20
